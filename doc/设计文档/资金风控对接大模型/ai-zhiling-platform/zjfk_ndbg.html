<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>年度报告</title>
  <style>
    :root {
      --page-bg: #edf1f5;
      --panel-bg: #ffffff;
      --line: #e9edf3;
      --line-dark: #d8dee8;
      --text: #596678;
      --text-light: #8f9bab;
      --head-bg: #f5f5f5;
      --blue: #2f86ff;
      --blue-dark: #2376ea;
      --blue-light: #eaf3ff;
      --red: #f26a6a;
      --red-dark: #ea5a5a;
      --gray: #f7f8fa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--page-bg);
      color: var(--text);
      font: 12px/1.5 "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }

    .page {
      width: min(100%, 1920px);
      min-height: 1440px;
      margin: 4px auto;
      background: var(--panel-bg);
      border: 1px solid var(--line);
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      background: #fafafa;
    }

    .field {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #8f98a7;
      white-space: nowrap;
    }

    .field input {
      width: 190px;
      height: 24px;
      padding: 0 8px;
      border: 1px solid var(--line-dark);
      background: #fff;
      color: var(--text);
      outline: none;
    }

    .field input::placeholder {
      color: #c2cad5;
    }

    .btn {
      height: 24px;
      padding: 0 12px;
      border: 1px solid transparent;
      border-radius: 2px;
      font-size: 12px;
      line-height: 22px;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--blue-dark);
      border-color: var(--blue-dark);
    }

    .btn-plain {
      background: #fff;
      border-color: var(--line-dark);
      color: #7d8898;
    }

    .btn-plain:hover {
      background: #f8fbff;
      border-color: #c6d7ef;
      color: #5a718d;
    }

    .btn-danger {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
    }

    .btn-danger:hover {
      background: var(--red-dark);
      border-color: var(--red-dark);
    }

    .btn-download {
      background: #6faaf0;
      border-color: #6faaf0;
      color: #fff;
    }

    .btn-download:hover {
      background: #5a9aea;
      border-color: #5a9aea;
    }

    .btn-ai {
      background: #8b72f2;
      border-color: #8b72f2;
      color: #fff;
    }

    .btn-ai:hover {
      background: #765ce8;
      border-color: #765ce8;
    }

    .btn-add::before {
      content: "+";
      margin-right: 4px;
      font-weight: 700;
    }

    .content {
      padding: 0 6px 8px;
    }

    .table-wrap {
      min-height: 200px;
      border: 1px solid var(--line);
      border-top: 0;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    thead th {
      height: 31px;
      padding: 0 8px;
      border-bottom: 1px solid var(--line);
      background: var(--head-bg);
      color: #9ca6b5;
      font-weight: 400;
      text-align: left;
    }

    tbody td {
      height: 32px;
      padding: 0 8px;
      border-bottom: 1px solid #f2f4f8;
      color: #6c7787;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    thead th + th,
    tbody td + td {
      border-left: 1px solid #f2f4f8;
    }

    .col-index,
    .cell-index {
      text-align: center;
    }

    .cell-actions {
      white-space: nowrap;
      padding-left: 6px;
      padding-right: 6px;
    }

    .cell-actions .btn {
      height: 20px;
      padding: 0 8px;
      line-height: 18px;
      font-size: 11px;
      vertical-align: middle;
    }

    .cell-actions .btn + .btn {
      margin-left: 4px;
    }

    .empty-row td {
      height: 360px;
      border-left: 0;
      text-align: center;
      color: #b2bcc9;
      vertical-align: top;
      padding-top: 110px;
    }

    .pager {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      height: 28px;
      padding: 0 6px;
      border: 1px solid var(--line);
      border-top: 0;
      color: #9aa5b4;
      background: #fff;
      font-size: 11px;
    }

    .prompt-box {
      margin-top: 10px;
      padding: 8px 10px;
      border: 1px solid #dbe7f5;
      border-left: 3px solid var(--blue);
      background: #f6faff;
    }

    .prompt-box.hidden {
      display: none;
    }

    .prompt-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .prompt-title {
      color: #425267;
      font-size: 12px;
      font-weight: 700;
    }

    .prompt-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .prompt-text {
      display: block;
      width: 100%;
      min-height: 54px;
      padding: 6px 8px;
      border: 1px solid var(--line-dark);
      background: #fff;
      color: var(--text);
      font: inherit;
      line-height: 1.6;
      resize: vertical;
      outline: none;
    }

    .prompt-text:focus {
      border-color: var(--blue);
    }

    .preview {
      margin-top: 10px;
      border: 1px solid var(--line);
      background: #fff;
    }

    .preview.hidden {
      display: none;
    }

    .preview-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      background: #f7f9fc;
    }

    .preview-title {
      margin: 0;
      font-size: 15px;
      color: #425267;
      font-weight: 700;
    }

    .preview-meta {
      margin-top: 4px;
      color: #98a4b3;
      font-size: 11px;
    }

    .preview-close {
      color: #7f90a4;
    }

    .preview-body {
      max-height: 1240px;
      padding: 18px 24px 24px;
      overflow-y: overlay;
    }

    .preview-file {
      width: min(100%, 1120px);
      margin: 0 auto 16px;
      border: 1px solid #e3eaf2;
      background: #fff;
      box-shadow: 0 8px 24px rgba(31, 55, 88, 0.05);
      overflow: hidden;
    }

    .preview-file.hidden,
    .doc-paper.hidden {
      display: none;
    }

    .preview-file-frame {
      display: block;
      width: 100%;
      height: 1200px;
      border: 0;
      background: #f6f8fb;
    }

    .preview-visuals {
      width: min(100%, 1120px);
      margin: 0 auto 16px;
    }

    .preview-visuals.hidden {
      display: none;
    }

    .visuals-title {
      margin: 0 0 10px;
      color: #44566d;
      font-size: 16px;
      font-weight: 700;
    }

    .chart-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .chart-card {
      border: 1px solid #e7edf5;
      border-radius: 6px;
      background: #fff;
      box-shadow: 0 4px 14px rgba(36, 63, 98, 0.05);
      overflow: hidden;
    }

    .chart-card.full {
      grid-column: 1 / -1;
    }

    .chart-card-head {
      padding: 10px 12px;
      border-bottom: 1px solid #edf2f7;
      color: #425267;
      font-size: 13px;
      font-weight: 700;
      background: #f9fbfd;
    }

    .chart-card-body {
      padding: 10px 12px 12px;
    }

    .chart-svg {
      display: block;
      width: 100%;
      height: 250px;
      background: linear-gradient(#ffffff, #fbfdff);
    }

    .chart-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      margin-top: 8px;
      color: #6c7b8f;
      font-size: 11px;
    }

    .chart-legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .chart-legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex: 0 0 10px;
    }

    .chart-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 250px;
      color: #9cabbc;
      font-size: 12px;
      background: #fbfdff;
    }

    .axis-text {
      fill: #8fa0b3;
      font-size: 10px;
    }

    .grid-line {
      stroke: #edf2f7;
      stroke-width: 1;
    }

    .chart-axis {
      stroke: #d9e2ec;
      stroke-width: 1;
    }

    .doc-paper {
      width: min(100%, 1120px);
      margin: 0 auto;
      padding: 36px 52px 42px;
      border: 1px solid #edf1f5;
      background: #fff;
      box-shadow: 0 8px 24px rgba(31, 55, 88, 0.05);
    }

    .doc-main-title {
      margin: 0;
      color: #304258;
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .doc-sub-title {
      margin: 12px 0 26px;
      color: #304258;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .doc-paragraph {
      margin: 0 0 12px;
      color: #556476;
      font-size: 14px;
      line-height: 1.9;
      text-indent: 2em;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .doc-ai {
      font-style: italic;
    }

    .doc-section {
      margin: 18px 0 12px;
      color: #3f4f65;
      font-size: 18px;
      font-weight: 700;
    }

    .doc-sub-section {
      margin: 14px 0 10px;
      color: #4d5f74;
      font-size: 15px;
      font-weight: 700;
    }

    .doc-sign {
      margin-top: 28px;
      text-align: right;
    }

    .pager-select,
    .pager-input {
      width: 52px;
      height: 20px;
      padding: 0 6px;
      border: 1px solid var(--line-dark);
      background: #fff;
      color: #718094;
      outline: none;
      font-size: 11px;
    }

    .pager-btn,
    .pager-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      border: 1px solid var(--line-dark);
      background: #fff;
      color: #7e8a9b;
      cursor: pointer;
      user-select: none;
    }

    .pager-btn[disabled] {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .pager-num.active {
      border-color: var(--blue);
      background: var(--blue);
      color: #fff;
    }

    .toast {
      position: fixed;
      top: 18px;
      right: 24px;
      min-width: 160px;
      padding: 10px 14px;
      border: 1px solid #d7e7ff;
      border-radius: 4px;
      background: #f4f9ff;
      color: #53729b;
      box-shadow: 0 6px 18px rgba(56, 89, 132, 0.08);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-8px);
      transition: all 0.2s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .download-mask {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 10px;
      background: rgba(47, 61, 83, 0.12);
    }

    .download-mask.hidden {
      display: none;
    }

    .download-dialog {
      width: 872px;
      border: 1px solid #b9c1ca;
      border-radius: 4px;
      background: #f3f3f3;
      box-shadow: 0 12px 28px rgba(33, 46, 64, 0.22);
      overflow: hidden;
    }

    .download-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 48px;
      padding: 0 16px;
      border-bottom: 1px solid #cfd5dd;
      background: linear-gradient(#f9f9f9, #ededed);
      cursor: move;
      user-select: none;
    }

    .download-head-title {
      color: #4b5563;
      font-size: 14px;
    }

    .download-close {
      position: relative;
      width: 28px;
      height: 28px;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .download-close::before,
    .download-close::after {
      content: "";
      position: absolute;
      top: 13px;
      left: 4px;
      width: 20px;
      height: 2px;
      background: #7e8794;
    }

    .download-close::before {
      transform: rotate(45deg);
    }

    .download-close::after {
      transform: rotate(-45deg);
    }

    .download-body {
      padding: 30px 32px 26px;
      background: #f3f3f3;
    }

    .download-row {
      display: grid;
      grid-template-columns: 68px 1fr;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }

    .download-label {
      color: #2f3d50;
      font-size: 17px;
      white-space: nowrap;
    }

    .download-value,
    .download-path-wrap {
      display: flex;
      align-items: center;
      height: 46px;
      border: 1px solid #bfc6cf;
      background: #fff;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }

    .download-value {
      padding: 0 14px;
      color: #2d415a;
      font-size: 17px;
    }

    .download-url {
      color: #a8b0bb;
    }

    .download-file-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .download-file-size {
      margin-left: 12px;
      color: #68788e;
      white-space: nowrap;
    }

    .download-path-wrap {
      overflow: hidden;
    }

    .download-path {
      flex: 1;
      padding: 0 12px;
      color: #2d415a;
      font-size: 17px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .download-space {
      padding: 0 12px 0 0;
      color: #7f8da2;
      font-size: 14px;
      white-space: nowrap;
    }

    .download-arrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 100%;
      border-left: 1px solid #c9d0d8;
      background: linear-gradient(#f8f8f8, #ececec);
      color: #49586c;
      font-size: 11px;
    }

    .download-browse {
      width: 106px;
      height: 46px;
      margin-left: 10px;
      border: 1px solid #bfc6cf;
      background: linear-gradient(#ffffff, #efefef);
      color: #2d415a;
      font-size: 17px;
      cursor: pointer;
    }

    .download-actions {
      display: flex;
      justify-content: flex-end;
      gap: 16px;
      padding: 66px 22px 6px 0;
    }

    .download-act-btn {
      min-width: 120px;
      height: 46px;
      border: 1px solid #bfc6cf;
      border-radius: 2px;
      background: linear-gradient(#ffffff, #efefef);
      color: #26384f;
      font-size: 17px;
      cursor: pointer;
    }

    .download-act-btn.primary {
      border-color: #6ea9ef;
      background: #70aff6;
      color: #fff;
    }

    @media (max-width: 1280px) {
      .page {
        min-height: 900px;
      }

      .table-wrap {
        min-height: 180px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="toolbar">
      <div class="field">
        <label for="reportName">报告名称</label>
        <input id="reportName" type="text" placeholder="请输入报告名称">
      </div>
      <button class="btn btn-primary" type="button" id="queryBtn">查询</button>
      <button class="btn btn-plain" type="button" id="resetBtn">重置</button>
      <button class="btn btn-primary btn-add" type="button" id="generateBtn">生成报告</button>
    </div>

    <div class="content">
      <div class="table-wrap">
        <table>
          <colgroup>
            <col style="width: 44px">
            <col style="width: 560px">
            <col style="width: 150px">
            <col style="width: 90px">
            <col style="width: 150px">
            <col style="width: 220px">
          </colgroup>
          <thead>
            <tr>
              <th class="col-index">序号</th>
              <th>报告名称</th>
              <th>发布时间</th>
              <th>创建人</th>
              <th>创建时间</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="reportRows"></tbody>
        </table>
      </div>

      <div class="pager">
        <span id="totalText">共 0 条</span>
        <select class="pager-select" id="pageSize">
          <option value="10">10条/页</option>
          <option value="20" selected>20条/页</option>
          <option value="50">50条/页</option>
        </select>
        <button class="pager-btn" type="button" id="prevBtn">&lt;</button>
        <span class="pager-num active" id="pageNum">1</span>
        <button class="pager-btn" type="button" id="nextBtn">&gt;</button>
        <span>前往</span>
        <input class="pager-input" id="gotoInput" type="text" value="1">
        <span>页</span>
        <button class="pager-btn" type="button" id="gotoBtn">确定</button>
      </div>

      <div class="prompt-box hidden" id="promptBox">
        <div class="prompt-head">
          <div class="prompt-title">大模型提示词</div>
          <div class="prompt-actions">
            <button class="btn btn-ai" type="button" id="promptAnalyzeBtn">智能分析</button>
            <button class="btn btn-plain" type="button" id="promptAiBtn">提示词智能生成</button>
            <button class="btn btn-primary" type="button" id="promptSaveBtn">保存提示词</button>
          </div>
        </div>
        <textarea class="prompt-text" id="promptText" rows="3"></textarea>
      </div>

      <div class="preview hidden" id="previewPanel">
        <div class="preview-head">
          <div>
            <h2 class="preview-title" id="previewTitle">报告预览</h2>
            <div class="preview-meta" id="previewMeta"></div>
          </div>
          <button class="btn btn-plain preview-close" type="button" id="closePreviewBtn">关闭</button>
        </div>
        <div class="preview-body">
          <div class="preview-file hidden" id="previewFileWrap">
            <iframe class="preview-file-frame" id="previewFileFrame" title="原文档预览"></iframe>
          </div>
          <div class="preview-visuals hidden" id="previewVisuals"></div>
          <div class="doc-paper" id="previewContent"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="download-mask hidden" id="downloadMask">
    <div class="download-dialog" id="downloadDialog">
      <div class="download-head" id="downloadHead">
        <div class="download-head-title">新建下载任务</div>
        <button class="download-close" type="button" id="downloadCloseBtn" aria-label="关闭"></button>
      </div>
      <div class="download-body">
        <div class="download-row">
          <div class="download-label">网址:</div>
          <div class="download-value">
            <span class="download-url" id="downloadUrl"></span>
          </div>
        </div>
        <div class="download-row">
          <div class="download-label">文件名:</div>
          <div class="download-value">
            <span class="download-file-name" id="downloadFileName"></span>
            <span class="download-file-size" id="downloadFileSize"></span>
          </div>
        </div>
        <div class="download-row">
          <div class="download-label">下载到:</div>
          <div style="display:flex; align-items:center;">
            <div class="download-path-wrap" style="flex:1;">
              <span class="download-path" id="downloadPath"></span>
              <span class="download-space" id="downloadSpace"></span>
              <span class="download-arrow">▼</span>
            </div>
            <button class="download-browse" type="button" id="downloadBrowseBtn">浏览</button>
          </div>
        </div>

        <div class="download-actions">
          <button class="download-act-btn" type="button" id="downloadOpenBtn">下载并打开</button>
          <button class="download-act-btn primary" type="button" id="downloadOnlyBtn">下载</button>
          <button class="download-act-btn" type="button" id="downloadCancelBtn">取消</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    (function () {
      var reportName = document.getElementById("reportName");
      var queryBtn = document.getElementById("queryBtn");
      var resetBtn = document.getElementById("resetBtn");
      var generateBtn = document.getElementById("generateBtn");
      var reportRows = document.getElementById("reportRows");
      var totalText = document.getElementById("totalText");
      var pageSize = document.getElementById("pageSize");
      var prevBtn = document.getElementById("prevBtn");
      var nextBtn = document.getElementById("nextBtn");
      var pageNum = document.getElementById("pageNum");
      var gotoInput = document.getElementById("gotoInput");
      var gotoBtn = document.getElementById("gotoBtn");
      var toast = document.getElementById("toast");
      var previewPanel = document.getElementById("previewPanel");
      var previewTitle = document.getElementById("previewTitle");
      var previewMeta = document.getElementById("previewMeta");
      var previewFileWrap = document.getElementById("previewFileWrap");
      var previewFileFrame = document.getElementById("previewFileFrame");
      var previewVisuals = document.getElementById("previewVisuals");
      var previewContent = document.getElementById("previewContent");
      var closePreviewBtn = document.getElementById("closePreviewBtn");
      var promptBox = document.getElementById("promptBox");
      var promptText = document.getElementById("promptText");
      var promptAnalyzeBtn = document.getElementById("promptAnalyzeBtn");
      var promptAiBtn = document.getElementById("promptAiBtn");
      var promptSaveBtn = document.getElementById("promptSaveBtn");
      var downloadMask = document.getElementById("downloadMask");
      var downloadDialog = document.getElementById("downloadDialog");
      var downloadHead = document.getElementById("downloadHead");

        } else if (title.indexOf("万元") > -1 && max > 1000000) {

          return chart;
        }

        return {
          id: chart.id,
          type: chart.type,
          title: chart.title,
          series: (chart.series || []).map(function (series) {
            return {
              name: series.name,
              categories: (series.categories || []).slice(),

        list[49] = "3.全省各地住房公积金存贷比相差较大，" + ai("受人口集聚、房地产市场热度和贷款政策执行节奏影响明显") + "，枣庄存贷比" + ai("整体偏低，与本地房地产市场处于修复阶段、提前还贷占比较高以及新增贷款投放不足密切相关，后续需在风险可控前提下提升政策资金使用效率") + "。";
        list[51] = "2026年全市实现增值收益0亿元，同比下降0%，较去年同期减少0万元，同比月下降金额约0.0万元；业务收入3.86亿元，同比下降28.09%；业务支出2.67亿元，同比增长-13.08%。" + ai("从结构看，业务收入下降主要受贷款余额下降、利息收入减少影响，支出同步回落则反映出资金付息和相关费用支出压力减轻。考虑到提前还贷占比偏高、存贷比偏低，增值收益增长基础仍然偏弱。");
        list[54] = ai("从回评情况看，资金竞争性存放工作总体平稳，存放结构较为分散，能够较好兼顾资金安全、流动性和收益性。后续建议进一步优化考核维度，重点关注合作银行对住房公积金归集扩面、便民服务和信息化建设的支持情况，推动“资金存放”与“服务贡献”联动评价。");
        list[56] = "2026年共有0家银行存款金额增加，银行存款增加最多的为亿元，其次为中国建设银行49.48亿元、中国农业银行14.05亿元、中国工商银行12.9亿元、中国邮政储蓄银行10.93亿元、中国银行2.76亿元、恒丰银行2.08亿元、交通银行1.53亿元、山东省农村信用社联合社0.56亿元、枣庄银行0.52亿元、青岛银行0亿元、滕州农商行0亿元、日照银行0亿元；共有0家银行存款金额减少，" + ai("说明当前统计口径下年末存款已基本完成压降或结转，银行间余额分布更多体现历史沉淀结构而非当期新增配置") + "。银行存款变化情况主要是受住房公积金资金存款变化及定期存款的因素影响。具体银行存款变化情况如下表所示：";
        list[58] = "12月末银行存款余额占比在10%以上有无数据占比0%。无数据较年初下降0%，占比变动主要受" + ai("资金集中清算、定期存款到期转存节奏以及业务资金归集投放时点变化影响。由于四季度数据尚未完整采集，相关占比变化仍需以后续补录数据复核") + "。";
        list[61] = ai("通过分析全年资金运行情况，主要存在以下问题：一是归集增长承压，传统产业和部分民营企业缴存稳定性不足，扩面增缴难度上升；二是提取和提前还贷增长较快，对资金沉淀和收益水平形成挤压；三是贷款投放恢复偏慢，政策资金支持住房消费的放大效应尚未充分体现；四是区域间资金运行差异扩大，个别机构存在净流出压力；五是四季度数据尚未采集，年度研判的精细化程度仍受基础数据完整性制约。");
        list[64] = "（一）" + ai("围绕枣庄产业转型和园区企业发展，持续推进归集扩面增缴，重点抓好灵活就业人员、民营企业和新业态从业人员建缴覆盖，夯实资金来源基础。");
        list[65] = "（二）" + ai("优化提取和贷款联动政策，既保障刚需和改善性住房消费，又要加强对高频提前还贷、资金集中外流等情况的监测，保持资金运行的稳定性和可持续性。");
        list[66] = "（三）" + ai("结合主城区、薛城、滕州等重点区域住房交易情况，精准支持合理住房贷款需求，提升政策资金使用效率，推动公积金制度在稳楼市、促消费中的作用更好发挥。");
        list[67] = "（四）" + ai("完善年度数据采集、月度监测和趋势预警机制，尽快补齐10-12月数据，形成“监测、分析、调度、反馈”闭环管理，为2027年资金运行决策提供更扎实的数据支撑。");
        return list;
      }

      // 大模型提示词：根据当前报告生成默认提示词
      function buildPromptText(report) {
        return "你是住房公积金资金运行分析专家。请通读《" + report.name + "》全文，结合山东省枣庄市经济与房地产市场情况，" +
          "对报告中“请人工补充分析”部分逐处补充分析（2026年10-12月数据尚未采集，按1-9月实绩与季节性趋势研判），" +
          "其他文字描述与图表保持不变，展示时按 PDF 预览。";
      }

      // 提示词智能生成：模拟调用大模型生成一版新的提示词，逐次切换分析角度
      var PROMPT_ANGLES = [
        "资金归集与扩面增缴",
        "提取结构与住房消费",
        "贷款发放与回收节奏",
        "存贷比与资金流动性",
        "增值收益与存款结构",
        "房地产市场交易活跃度",
        "缴存基数与覆盖人群变化",
        "提前还贷与资金外流",
        "区域间业务差异"
      ];
      var promptRound = 0;

      function buildLlmPromptText(report) {
        var angles = [];
        for (var i = 0; i < 3; i += 1) {
          angles.push(PROMPT_ANGLES[(promptRound * 3 + i) % PROMPT_ANGLES.length]);
        }
        promptRound += 1;
        return "你是住房公积金资金运行分析专家。请通读《" + report.name + "》，重点结合" + angles.join("、") +
          "，分析2026年度资金运行情况，并替换报告中“请人工补充分析”的内容（2026年10-12月数据未采集，" +
          "按已有数据与季节规律研判），其余文字与图表保持不变，展示时按 PDF 预览。";
      }

      function activeReport() {
        return reports.find(function (item) {
          return item.id === state.activeReportId;
        });
      }

      function hidePromptBox() {
        promptBox.classList.add("hidden");
        promptText.value = "";
      }

      function showPromptBox(report) {
        promptText.value = buildPromptText(report);
        promptBox.classList.remove("hidden");
      }

      // 智能分析：在原文档中补充分析内容并按 PDF 预览
      function runAnalysis(report) {
        if (report.analysisPdfPath) {
          report.analysisReady = true;
          showPreview(report, "analysisPdf");
          showToast("智能分析已完成，已按原文档版式生成 PDF");
          return;
        }

        if (!report.originalContent || !report.originalContent.length) {
          showToast("当前报告暂无可分析的文档内容");
          return;
        }
        report.content = buildAnalysisContent(report.originalContent);
        report.analysisReady = true;
        showPreview(report, "analysis");
        showToast("智能分析已完成，已补全人工分析内容");
      }

      function hidePreview() {
        state.activeReportId = null;
        hidePromptBox();
        previewPanel.classList.add("hidden");
        previewTitle.textContent = "报告预览";
        previewMeta.textContent = "";
        previewFileWrap.classList.add("hidden");
        previewFileFrame.src = "";
        previewVisuals.classList.add("hidden");
        previewVisuals.innerHTML = "";
        previewContent.classList.remove("hidden");
        previewContent.innerHTML = "";
      }

      function showPreview(report, mode) {
        state.activeReportId = report.id;
        previewTitle.textContent = report.name;
        mode = mode || "analysis";

        if (mode === "original" && report.pdfPath) {
          previewMeta.textContent = "来源文件：" + report.docPath + " | 按原文档版式预览";
          previewFileFrame.src = toFileUrl(report.pdfPath);
          previewFileWrap.classList.remove("hidden");
          previewVisuals.classList.add("hidden");
          previewVisuals.innerHTML = "";
          previewContent.classList.add("hidden");
          previewContent.innerHTML = "";
          previewPanel.classList.remove("hidden");
          return;
        }

        if (mode === "analysisPdf" && report.analysisPdfPath) {
          previewMeta.textContent = "来源文件：" + (report.analysisDocPath || report.docPath) + " | 已在原文档中补充智能分析并按 PDF 预览";
          previewFileFrame.src = toFileUrl(report.analysisPdfPath);
          previewFileWrap.classList.remove("hidden");
          previewVisuals.classList.add("hidden");
          previewVisuals.innerHTML = "";
          previewContent.classList.add("hidden");
          previewContent.innerHTML = "";
          previewPanel.classList.remove("hidden");
          return;
        }

        previewFileWrap.classList.add("hidden");
        previewFileFrame.src = "";
        previewContent.classList.remove("hidden");
        previewMeta.textContent = report.docPath
          ? "来源文件：" + report.docPath + (report.analysisReady ? " | 已完成智能分析补全（10-12月数据缺失按趋势研判）" : "")
          : "来源文件：当前记录未绑定文档";
        renderChartGallery(report.charts || []);

        if (!report.content || !report.content.length) {
          previewContent.innerHTML = '<p class="doc-paragraph" style="text-indent:0">当前报告暂无可预览的文档内容。</p>';
        } else {
          previewContent.innerHTML = report.content.map(function (item, index) {
            var plainText = stripAiMarkers(item);
            return '<p class="' + paragraphClass(plainText, index) + '">' + renderInlineAiText(item) + '</p>';
          }).join("");
        }

        previewPanel.classList.remove("hidden");
      }

      reports.forEach(function (report) {
        report.originalContent = report.content.slice();
        report.analysisReady = false;
      });

      function resetDownloadDialogPosition() {
        downloadDialog.style.transform = "";
      }

      function hideDownloadDialog() {
        state.activeDownloadId = null;
        downloadMask.classList.add("hidden");
        resetDownloadDialogPosition();
      }

      function showDownloadDialog(report) {
        state.activeDownloadId = report.id;
        downloadUrl.textContent = report.downloadUrl || "";
        downloadFileName.textContent = report.fileName || (report.name + ".docx");
        downloadFileSize.textContent = report.fileSize || "0 KB";
        downloadPath.textContent = report.downloadPath || "C:\\Users\\qyq\\Desktop";
        downloadSpace.textContent = report.freeSpace || "剩: 14.32 GB";
        downloadMask.classList.remove("hidden");
        resetDownloadDialogPosition();
      }

      function updatePager(total) {
        var totalPage = Math.max(1, Math.ceil(total / state.pageSize));
        if (state.page > totalPage) {
          state.page = totalPage;
        }
        totalText.textContent = "共 " + total + " 条";
        pageNum.textContent = state.page;
        gotoInput.value = state.page;
        prevBtn.disabled = state.page <= 1;
        nextBtn.disabled = state.page >= totalPage;
      }

      function renderTable() {
        var filtered = getFilteredList();
        var rows = getPagedList(filtered);

        updatePager(filtered.length);

        if (!rows.length) {
          reportRows.innerHTML = [
            '<tr class="empty-row">',
            '<td colspan="6">暂无数据</td>',
            '</tr>'
          ].join("");
          return;
        }

        reportRows.innerHTML = rows.map(function (item, index) {
          var rowNo = (state.page - 1) * state.pageSize + index + 1;
          return [
            "<tr>",
            '<td class="cell-index">' + rowNo + "</td>",
            "<td title=\"" + item.name + "\">" + item.name + "</td>",
            "<td>" + item.publishTime + "</td>",
            "<td>" + item.creator + "</td>",
            "<td>" + item.createTime + "</td>",
            '<td class="cell-actions">',
            '<button class="btn btn-primary" type="button" data-action="view" data-id="' + item.id + '">查看</button>',
            '<button class="btn btn-ai" type="button" data-action="analyze" data-id="' + item.id + '">智能分析</button>',
            '<button class="btn btn-download" type="button" data-action="download" data-id="' + item.id + '">下载</button>',
            '<button class="btn btn-danger" type="button" data-action="delete" data-id="' + item.id + '">删除</button>',
            "</td>",
            "</tr>"
          ].join("");
        }).join("");
      }

      function doQuery() {
        state.keyword = reportName.value.trim();
        state.page = 1;
        renderTable();
      }

      function doReset() {
        reportName.value = "";
        state.keyword = "";
        state.page = 1;
        renderTable();
      }

      function doGenerate() {
        var time = nowText();
        reports.unshift({
          id: Date.now(),
          name: formatReportName(),
          publishTime: time,
          creator: "运营员1",
          createTime: time,
          docPath: "",
          pdfPath: "",
          analysisDocPath: "",
          analysisPdfPath: "",
          fileName: formatReportName() + ".docx",
          fileSize: "0 KB",
          downloadUrl: "blob:http://100.70.3.16:9031/generated-" + Date.now(),
          downloadPath: "C:\\Users\\qyq\\Desktop",
          freeSpace: "剩: 14.32 GB",
          content: [],
          originalContent: [],
          analysisReady: false
        });
        state.page = 1;
        renderTable();
        showToast("年度报告已生成");
      }

      function changePage(nextPage) {
        var totalPage = Math.max(1, Math.ceil(getFilteredList().length / state.pageSize));
        if (nextPage < 1 || nextPage > totalPage) {
          return;
        }
        state.page = nextPage;
        renderTable();
      }

      queryBtn.addEventListener("click", doQuery);
      resetBtn.addEventListener("click", doReset);
      generateBtn.addEventListener("click", doGenerate);
      reportName.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          doQuery();
        }
      });

      pageSize.addEventListener("change", function () {
        state.pageSize = +pageSize.value;
        state.page = 1;
        renderTable();
      });

      prevBtn.addEventListener("click", function () {
        changePage(state.page - 1);
      });

      nextBtn.addEventListener("click", function () {
        changePage(state.page + 1);
      });

      gotoBtn.addEventListener("click", function () {
        var nextPage = parseInt(gotoInput.value, 10);
        if (!nextPage) {
          gotoInput.value = state.page;
          return;
        }
        changePage(nextPage);
      });

      closePreviewBtn.addEventListener("click", hidePreview);
      // 生成智能分析：按当前提示词对当前报告重新执行智能分析
      promptAnalyzeBtn.addEventListener("click", function () {
        var report = activeReport();
        if (!report) {
          showToast("请先选择需要分析的报告");
          return;
        }
        runAnalysis(report);
      });
      // 提示词智能生成：调用大模型生成一版新的提示词
      promptAiBtn.addEventListener("click", function () {
        var report = activeReport();
        if (!report) {
          return;
        }
        var original = promptAiBtn.textContent;
        promptAiBtn.textContent = "生成中…";
        promptAiBtn.disabled = true;
        window.setTimeout(function () {
          promptText.value = buildLlmPromptText(report);
          promptAiBtn.textContent = original;
          promptAiBtn.disabled = false;
        }, 500);
      });
      // 保存提示词：保存当前编辑后的提示词
      promptSaveBtn.addEventListener("click", function () {
        var original = promptSaveBtn.textContent;
        promptSaveBtn.textContent = "已保存";
        promptSaveBtn.disabled = true;
        window.setTimeout(function () {
          promptSaveBtn.textContent = original;
          promptSaveBtn.disabled = false;
        }, 1200);
        showToast("提示词已保存");
      });
      downloadCloseBtn.addEventListener("click", hideDownloadDialog);
      downloadCancelBtn.addEventListener("click", hideDownloadDialog);
      downloadBrowseBtn.addEventListener("click", function () {
        showToast("已打开路径选择");
      });
      downloadOnlyBtn.addEventListener("click", function () {
        showToast("下载任务已创建");
        hideDownloadDialog();
      });
      downloadOpenBtn.addEventListener("click", function () {
        showToast("已开始下载并将在完成后打开");
        hideDownloadDialog();
      });
      downloadMask.addEventListener("click", function (event) {
        if (event.target === downloadMask) {
          hideDownloadDialog();
        }
      });

      reportRows.addEventListener("click", function (event) {
        var target = event.target;
        var action = target.getAttribute("data-action");
        var id = +target.getAttribute("data-id");
        var report = reports.find(function (item) {
          return item.id === id;
        });

        if (!action || !id || !report) {
          return;
        }

        if (action === "view") {
          hidePromptBox();
          showPreview(report, "original");
          showToast("已加载报告内容");
          return;
        }

        if (action === "analyze") {
          showPromptBox(report);
          runAnalysis(report);
          return;
        }

        if (action === "download") {
          showDownloadDialog(report);
          return;
        }

        if (action === "delete") {
          reports = reports.filter(function (item) {
            return item.id !== id;
          });
          if (state.activeReportId === id) {
            hidePreview();
          }
          if (state.activeDownloadId === id) {
            hideDownloadDialog();
          }
          renderTable();
          showToast("报告已删除");
        }
      });

      (function enableDownloadDialogDrag() {
        var startX = 0;
        var startY = 0;
        var translateX = 0;
        var translateY = 0;
        var dragging = false;

        downloadHead.addEventListener("mousedown", function (event) {
          dragging = true;
          startX = event.clientX - translateX;
          startY = event.clientY - translateY;
          document.body.style.userSelect = "none";
        });

        document.addEventListener("mousemove", function (event) {
          if (!dragging) {
            return;
          }
          translateX = event.clientX - startX;
          translateY = event.clientY - startY;
          downloadDialog.style.transform = "translate(" + translateX + "px, " + translateY + "px)";
        });

        document.addEventListener("mouseup", function () {
          dragging = false;
          document.body.style.userSelect = "";
        });
      })();

      renderTable();
    })();
  </script>
</body>
</html>
