<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>缴存金额</title>
  <style>
    :root {
      --page-bg: #edf1f5;
      --panel-bg: #ffffff;
      --line: #e7ebf0;
      --line-dark: #d9dfe7;
      --text: #566272;
      --text-light: #8a96a5;
      --title: #2c3b4f;
      --blue: #2f86ff;
      --green: #6dbd45;
      --red: #ef5350;
      --gray-btn: #7e8693;
      --blue-btn: #2f86ff;
      --green-btn: #6fbe45;
      --red-btn: #ef5350;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--page-bg);
      color: var(--text);
      font: 12px/1.5 "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }

    .page {
      width: min(100%, 1920px);
      min-height: 1440px;
      margin: 4px auto;
      background: var(--panel-bg);
      border: 1px solid var(--line);
    }

    .tabs {
      display: flex;
      align-items: center;
      gap: 28px;
      height: 28px;
      padding: 0 18px;
      background: #f8fafc;
      border-bottom: 1px solid var(--line);
    }

    .tab {
      position: relative;
      display: inline-flex;
      align-items: center;
      height: 100%;
      color: #6b7684;
      text-decoration: none;
      white-space: nowrap;
    }

    .tab.active {
      color: var(--blue);
      font-weight: 700;
    }

    .tab.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background: var(--blue);
    }

    .toolbar {
      padding: 10px 18px 8px;
      border-bottom: 1px solid var(--line);
      background: #f7f9fb;
    }

    .toolbar-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .field {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: #7d8897;
      white-space: nowrap;
    }

    .field label {
      transform: scale(0.96);
      transform-origin: left center;
    }

    .field select,
    .field input {
      height: 22px;
      padding: 0 8px;
      border: 1px solid var(--line-dark);
      background: #fff;
      color: #556273;
      font-size: 12px;
      outline: none;
    }

    .field select { width: 180px; }
    .field.month input { width: 120px; }
    .field.num input {
      width: 50px;
      text-align: center;
    }

    .stepper {
      display: inline-flex;
      align-items: center;
      overflow: hidden;
      border: 1px solid var(--line-dark);
      background: #fff;
    }

    .stepper input {
      width: 44px;
      height: 20px;
      border: 0;
      text-align: center;
      padding: 0;
    }

    .step-btns {
      display: flex;
      flex-direction: column;
      width: 16px;
      border-left: 1px solid var(--line-dark);
    }

    .step-btns button {
      height: 10px;
      border: 0;
      background: #fafbfc;
      color: #91a0b0;
      font-size: 9px;
      line-height: 10px;
      cursor: pointer;
      padding: 0;
    }

    .step-btns button + button {
      border-top: 1px solid var(--line-dark);
    }

    .btn {
      height: 22px;
      padding: 0 12px;
      border: 0;
      color: #fff;
      font-size: 11px;
      cursor: pointer;
      line-height: 22px;
      white-space: nowrap;
    }

    .btn.gray { background: var(--gray-btn); }
    .btn.blue { background: var(--blue-btn); }
    .btn.green { background: var(--green-btn); }
    .btn.red { background: var(--red-btn); }

    .toolbar-tip {
      margin-top: 7px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #9aa5b3;
      font-size: 11px;
    }

    .toolbar-tip::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--blue);
    }

    .subbar {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 26px;
      padding: 0 18px;
      border-top: 1px solid #fbfcfd;
      border-bottom: 1px solid var(--line);
      color: #a1acb8;
      background: #fafbfc;
      font-size: 11px;
    }

    .content {
      padding: 14px 8px 18px;
      background: #fff;
    }

    .section-title {
      margin: 0 0 6px;
      padding: 0 0 0 2px;
      font-size: 15px;
      color: #3a4655;
      font-weight: 700;
    }

    .prompt-box {
      margin: 0 2px 10px;
      padding: 8px 10px;
      border: 1px solid #dbe7f5;
      border-left: 3px solid var(--blue);
      background: #f6faff;
    }

    .prompt-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .prompt-title {
      color: #3a4655;
      font-size: 12px;
      font-weight: 700;
    }

    .prompt-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .prompt-text {
      display: block;
      width: 100%;
      min-height: 54px;
      padding: 6px 8px;
      border: 1px solid var(--line-dark);
      background: #fff;
      color: #6b7684;
      font: inherit;
      line-height: 1.6;
      resize: vertical;
      outline: none;
    }

    .prompt-text:focus {
      border-color: var(--blue);
    }

    .minor-title {
      margin: 0 0 8px;
      padding-left: 2px;
      color: #586677;
      font-size: 12px;
    }

    .chart-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 2px 4px;
    }

    .algo {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--green);
      font-size: 11px;
      white-space: nowrap;
    }

    .algo::before {
      content: "";
      width: 2px;
      height: 14px;
      background: var(--blue);
    }

    .chart-box {
      position: relative;
      height: 230px;
      margin: 0 4px 16px;
      overflow: hidden;
    }

    .legend {
      position: absolute;
      top: 12px;
      right: 44px;
      display: flex;
      gap: 18px;
      color: #7e8996;
      font-size: 10px;
      z-index: 1;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .legend-line {
      width: 14px;
      border-top: 2px solid currentColor;
    }

    .legend-item.blue { color: var(--blue); }
    .legend-item.green { color: var(--green); }
    .legend-item.red { color: var(--red); }
    .legend-item.green .legend-line { border-top-style: dashed; }
    .legend-item.red .legend-line { border-top-style: dashed; }

    #trendChart {
      width: 100%;
      height: 100%;
      display: block;
    }

    .grid {
      stroke: #e9edf3;
      stroke-width: 1;
    }

    .axis {
      fill: #a3adba;
      font-size: 8px;
    }

    .history-line {
      fill: none;
      stroke: var(--blue);
      stroke-width: 1.6;
      stroke-linejoin: round;
      stroke-linecap: round;
    }

    .forecast-line {
      fill: none;
      stroke: var(--green);
      stroke-width: 1.6;
      stroke-linejoin: round;
      stroke-linecap: round;
      stroke-dasharray: 4 3;
    }

    .history-dot {
      fill: var(--blue);
      stroke: #fff;
      stroke-width: 1;
    }

    .forecast-dot {
      fill: var(--green);
      stroke: #fff;
      stroke-width: 1;
    }

    .llm-line {
      fill: none;
      stroke: var(--red);
      stroke-width: 1.6;
      stroke-linejoin: round;
      stroke-linecap: round;
      stroke-dasharray: 6 4;
    }

    .llm-dot {
      fill: var(--red);
      stroke: #fff;
      stroke-width: 1;
    }

    .detail-title {
      margin: 0 2px 8px;
      color: #596678;
      font-size: 12px;
      font-weight: 700;
    }

    .table-wrap {
      margin: 0 2px;
      border: 1px solid var(--line);
      background: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th,
    td {
      height: 30px;
      padding: 0 12px;
      border-bottom: 1px solid #eef2f6;
      font-size: 11px;
      color: #657180;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    th {
      background: #f7f8fa;
      color: #9aa5b1;
      font-weight: 600;
      text-align: left;
    }

    td.num {
      text-align: right;
      font-family: Consolas, "Courier New", monospace;
    }

    .data-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 56px;
      height: 18px;
      padding: 0 7px;
      border: 1px solid #bfe3ad;
      background: #eff9e9;
      color: #6eaf4f;
      font-size: 11px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 1940px) {
      .page {
        width: calc(100% - 12px);
      }
    }

    @media (max-width: 860px) {
      .toolbar {
        padding-left: 12px;
        padding-right: 12px;
      }

      .subbar,
      .tabs {
        padding-left: 12px;
        padding-right: 12px;
      }

      .content {
        padding-left: 4px;
        padding-right: 4px;
      }

      .field select {
        width: 150px;
      }

      .legend {
        right: 18px;
        top: 8px;
        gap: 12px;
      }
    }

    @media (max-width: 720px) {
      .tabs {
        gap: 14px;
        flex-wrap: wrap;
        height: auto;
        padding-top: 6px;
        padding-bottom: 6px;
      }

      .tab {
        height: 24px;
      }

      .subbar {
        height: auto;
        padding-top: 6px;
        padding-bottom: 6px;
        flex-wrap: wrap;
      }

      .chart-box {
        height: 200px;
      }

      th,
      td {
        padding-left: 8px;
        padding-right: 8px;
      }
    }
  </style>
</head>

  <div class="page">
    <div class="tabs">
      <a class="tab active" href="javascript:void(0)" data-tab="deposit">缴存金额</a>

    </div>

    <div class="toolbar">
      <div class="toolbar-row">
        <div class="field">
          <label for="unitName">机构</label>
          <select id="unitName">
            <option>住房公积金管理中心</option>
          </select>
        </div>

        <div class="field month">
          <label for="reportMonth">预测起始月份</label>
          <input id="reportMonth" type="month" value="2026-10">
        </div>

        <div class="field num">
          <label for="forecastNum">预测周期</label>
          <div class="stepper">
            <input id="forecastNum" type="text" value="13" readonly>
            <div class="step-btns">
              <button type="button" id="stepUp">+</button>
              <button type="button" id="stepDown">-</button>
            </div>
          </div>
        </div>

        <div class="field">
          <label>个月</label>
        </div>

        <button class="btn gray" type="button" id="queryBtn">查询数据</button>
        <button class="btn blue" type="button" id="predictBtn">预测数据</button>
        <button class="btn red" type="button" id="llmBtn">大模型预测</button>
        <button class="btn green" type="button" id="saveBtn">保存预测模型</button>
      </div>

      <div class="toolbar-tip">可预测未来 1 至 13 个月（含趋势外推），预测模型算法：GRU</div>
    </div>

    <div class="subbar">
      <span>预测基础数据：历史数据回溯</span>
      <span>机构名称：青岛市住房公积金管理中心</span>
      <span>预测日期：2026-10-19</span>
      <span>模型：GRU</span>
    </div>

    <div class="content">
      <div class="prompt-box hidden" id="promptBox">
        <div class="prompt-head">
          <div class="prompt-title">大模型提示词</div>
          <div class="prompt-actions">
            <button class="btn blue" type="button" id="promptPredictBtn">数据预测</button>
            <button class="btn gray" type="button" id="promptSuggestBtn">提示词智能生成</button>
            <button class="btn green" type="button" id="promptSaveBtn">保存提示词</button>
          </div>
        </div>
        <textarea class="prompt-text" id="promptText" rows="3"></textarea>
      </div>
      <h1 class="section-title" id="sectionTitle">缴存金额预测结果</h1>
      <div class="chart-head">
        <div class="minor-title">趋势图</div>
        <div class="algo">用优预测算法 GRU</div>
      </div>

      <div class="chart-box">
        <div class="legend">
          <span class="legend-item blue"><span class="legend-line"></span>历史数据</span>
          <span class="legend-item green"><span class="legend-line"></span>预测数据</span>
          <span class="legend-item red hidden" id="llmLegend"><span class="legend-line"></span>大模型预测</span>
        </div>
        <svg id="trendChart" viewBox="0 0 990 230" preserveAspectRatio="none" aria-label="缴存金额预测结果趋势图"></svg>
      </div>

          </thead>
          <tbody id="detailRows"></tbody>
        </table>
      </div>
    </div>
  </div>

      var dataset = DATASETS[currentTab];

      // 保存各页签大模型预测初值，切换页签或重新预测时可还原
      var ORIGINALS = {};
      Object.keys(DATASETS).forEach(function (key) {
        ORIGINALS[key] = {
          llm: DATASETS[key].llm.slice(),
          notes: Object.assign({}, DATASETS[key].notes)
        };
      });

      // 各月份业务特征说明，供大模型预测说明使用
      var MONTH_HINT = {
        1: "年初业务平稳，回归常态节奏",
        2: "受春节假期影响，业务量处于年内低点",
        3: "节后业务回升，需求集中释放",
        4: "业务运行平稳，无明显季节性波动",
        5: "常规月份，业务量保持稳定",
        6: "年度结息因素带动，业务量处于年内高点",
        7: "高峰回落，业务回归常态",
        8: "暑期业务平稳，波动较小",
        9: "业务小幅抬升，进入三季度末集中办理期",
        10: "四季度开局，业务量常规水平",
        11: "年末业务平稳，办理节奏稳定",
        12: "年末集中办理，业务量有所抬升"
      };

      function average(list) {
        if (!list.length) {
          return 0;
        }
        return list.reduce(function (sum, value) { return sum + value; }, 0) / list.length;
      }

      // 同月季节性系数：该月历史均值 / 全历史均值
      function seasonalIndex(month) {
        var overall = average(dataset.history);
        if (!overall) {
          return 1;
        }
        var sameMonth = [];
        dataset.history.forEach(function (value, index) {
          var monthText = monthList(2017, 1, dataset.history.length)[index].split("-")[1];
          if (parseInt(monthText, 10) === month) {
            sameMonth.push(value);
          }
        });
        return sameMonth.length ? average(sameMonth) / overall : 1;
      }

      // 解析提示词中的走势倾向
      function promptTone(prompt) {
        if (/增长|上升|上行|回暖|回升|提高|增加/.test(prompt)) {
          return "上行";
        }
        if (/下降|下行|回落|下滑|减少|走低/.test(prompt)) {
          return "下行";
        }
        return "平稳";
      }

      // 提示词倾向对应的调节系数
      function promptBias(prompt) {
        var bias = 0;
        var tone = promptTone(prompt);
        if (tone === "上行") {
          bias += 0.03;
        } else if (tone === "下行") {
          bias -= 0.03;
        }
        if (/保守|稳健|谨慎|从紧/.test(prompt)) {
          bias -= 0.015;
        }
        if (/乐观|积极|看好|扩张/.test(prompt)) {
          bias += 0.015;
        }
        return bias;
      }

      // 模拟调用大模型：根据提示词倾向与历史数据（近 12 个月水平 + 同月季节性 + 同比增速）生成预测
      function runLlmPredict() {
        var series = buildSeries();
        var prompt = promptText.value || "";
        var recent = dataset.history.slice(-12);
        var previous = dataset.history.slice(-24, -12);
        var base = average(recent);
        var yoy = previous.length ? (base - average(previous)) / average(previous) : 0;
        var drift = yoy + promptBias(prompt);
        var tone = promptTone(prompt);

        dataset.llm = series.forecast.map(function (item, index) {
          var month = parseInt(item.month.split("-")[1], 10);
          var factor = Math.pow(1 + drift, (index + 1) / 12) * seasonalIndex(month);
          return Math.round(base * factor * 100) / 100;
        });

        dataset.notes = {};
        series.forecast.forEach(function (item, index) {
          var month = parseInt(item.month.split("-")[1], 10);
          var compare = dataset.llm[index] > item.value
            ? "预计略高于算法模型预测"
            : dataset.llm[index] < item.value
              ? "预计略低于算法模型预测"
              : "预计与算法模型预测持平";
          dataset.notes[item.month] = MONTH_HINT[month] + "，结合提示词中的" + tone + "判断，" + compare + "。";
        });
      }

      function pad(num) {
        return String(num).padStart(2, "0");
      }

      function monthList(startYear, startMonth, count) {
        var list = [];
        var year = startYear;
        var month = startMonth;
        for (var i = 0; i < count; i += 1) {
          list.push(year + "-" + pad(month));
          month += 1;
          if (month > 12) {
            month = 1;
            year += 1;
          }
        }
        return list;
      }

      function toPolyline(list, offset, px, py) {
        return list.map(function (item, index) {
          return px(index + offset) + "," + py(item.value);
        }).join(" ");
      }

      function toAmountText(value) {
        return (value * 100000000).toLocaleString("en-US", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        });
      }

      function buildSeries() {
        var historyMonths = monthList(2017, 1, dataset.history.length);
        var forecastStart = historyMonths[historyMonths.length - 1].split("-");
        var nextYear = +forecastStart[0];
        var nextMonth = +forecastStart[1] + 1;
        if (nextMonth > 12) {
          nextMonth = 1;
          nextYear += 1;
        }

        var history = dataset.history.map(function (value, index) {
          return { month: historyMonths[index], value: value };
        });

        var forecastMonths = monthList(nextYear, nextMonth, dataset.forecast.length);
        var forecast = dataset.forecast.map(function (value, index) {
          return { month: forecastMonths[index], value: value };
        });
        var llmForecast = dataset.llm.map(function (value, index) {
          return { month: forecastMonths[index], value: value };
        });

        return { history: history, forecast: forecast, llmForecast: llmForecast };
      }

      function renderChart() {
        var series = buildSeries();
        var history = series.history;
        var forecast = series.forecast;
        var llmForecast = series.llmForecast;
        var all = history.concat(forecast);
        var width = 990;
        var height = 230;
        var left = 46;
        var right = 14;
        var top = 16;
        var bottom = 40;
        var plotWidth = width - left - right;
        var plotHeight = height - top - bottom;
        var max = dataset.yMax;

        function px(index) {
          return left + (plotWidth * index / (all.length - 1));
        }

        function py(value) {
          return top + (max - value) / max * plotHeight;
        }

        var gridHtml = "";
        var ticks = dataset.yTicks || 5;
        for (var i = 0; i <= ticks; i += 1) {
          var yValue = (max / ticks) * i;
          var y = py(yValue);
          gridHtml += '<line class="grid" x1="' + left + '" y1="' + y + '" x2="' + (width - right) + '" y2="' + y + '"></line>';
          gridHtml += '<text class="axis" x="' + (left - 6) + '" y="' + (y + 4) + '" text-anchor="end">' + yValue.toFixed(1) + "亿</text>";
        }

        var xHtml = "";
        for (var j = 0; j < all.length; j += 6) {
          xHtml += '<text class="axis" transform="translate(' + px(j) + " " + (height - 12) + ') rotate(48)" text-anchor="start">' + all[j].month + "</text>";
        }
        xHtml += '<text class="axis" transform="translate(' + px(all.length - 1) + " " + (height - 12) + ') rotate(48)" text-anchor="start">' + all[all.length - 1].month + "</text>";

        var histMarks = history.map(function (item, index) {
          if (!(index % 10 === 0 || index >= history.length - 3)) return "";
          return '<circle class="history-dot" cx="' + px(index) + '" cy="' + py(item.value) + '" r="2.2"></circle>';
        }).join("");

        var forecastOffset = history.length - 1;
        var predMarks = forecast.map(function (item, index) {
          return '<circle class="forecast-dot" cx="' + px(index + forecastOffset) + '" cy="' + py(item.value) + '" r="2.2"></circle>';
        }).join("");
        var llmLine = "";
        var llmMarks = "";
        if (llmEnabled) {
          llmLine = '<polyline class="llm-line" points="' + toPolyline(llmForecast, forecastOffset, px, py) + '"></polyline>';
          llmMarks = llmForecast.map(function (item, index) {
            return '<circle class="llm-dot" cx="' + px(index + forecastOffset) + '" cy="' + py(item.value) + '" r="2.2"></circle>';
          }).join("");
          llmLegend.classList.remove("hidden");
        } else {
          llmLegend.classList.add("hidden");
        }

        chart.innerHTML =
          '<rect x="0" y="0" width="' + width + '" height="' + height + '" fill="#fff"></rect>' +
          gridHtml +
          '<polyline class="history-line" points="' + toPolyline(history, 0, px, py) + '"></polyline>' +
          '<polyline class="forecast-line" points="' + toPolyline(forecast, forecastOffset, px, py) + '"></polyline>' +
          llmLine +
          histMarks +
          predMarks +
          llmMarks +
          xHtml;
      }

      function renderRows() {
        var series = buildSeries();
        var historyRows = series.history.map(function (item) {
          return [item.month, toAmountText(item.value), "-", "-", "历史数据"];
        });
        var forecastRows = series.forecast.map(function (item, index) {
          return [
            item.month,
            toAmountText(item.value),
            llmEnabled ? toAmountText(series.llmForecast[index].value) : "-",
            llmEnabled ? (dataset.notes[item.month] || "-") : "待执行大模型预测",
            "预测数据"
          ];
        });
        var allRows = historyRows.concat(forecastRows);
        // 数据详情按月份倒序排列（最新月份在前）
        allRows.sort(function (a, b) {
          return a[0] < b[0] ? 1 : a[0] > b[0] ? -1 : 0;
        });

        detailRows.innerHTML = allRows.map(function (row) {
          return (
            "<tr>" +
              "<td>" + row[0] + "</td>" +
              '<td class="num">' + row[1] + "</td>" +
              '<td class="num">' + row[2] + '</td>' +
              "<td>" + row[3] + "</td>" +
              '<td><span class="data-tag">' + row[4] + '</span></td>' +
            "</tr>"
          );
        }).join("");
      }

      function changeCount(delta) {
        var current = parseInt(forecastNum.value, 10) || 13;
        current = Math.max(1, Math.min(24, current + delta));
        forecastNum.value = current;
      }

      // 构造发送给大模型的提示词，随页签与预测区间联动
      function buildPromptText() {
        var series = buildSeries();
        var firstMonth = series.history[0].month;
        var lastMonth = series.history[series.history.length - 1].month;
        var startMonth = series.forecast[0].month;
        var endMonth = series.forecast[series.forecast.length - 1].month;
        return "你是住房公积金资金运行分析专家。请基于" + unitName.value + " " + firstMonth + " 至 " + lastMonth +
          " 的" + dataset.name + "历史数据（共 " + series.history.length + " 个月），结合宏观经济形势、房地产政策及住房公积金业务季节性波动规律，预测 " +
          startMonth + " 至 " + endMonth + " 共 " + series.forecast.length + " 个月的" + dataset.name +
          "，并逐月给出预测说明及主要影响因素。";
      }

      // AI 生成提示词：模拟调用大模型生成一版新的提示词，逐次切换分析角度
      var PROMPT_ANGLES = [
        "宏观经济形势",
        "房地产调控政策",
        "住房交易活跃度",
        "缴存覆盖与基数调整",
        "居民购房与还贷行为",
        "提前还贷与资金流动性",
        "季节性波动规律",
        "人口流动与就业变化",
        "区域间业务差异"
      ];
      var promptRound = 0;

      function buildLlmPromptText() {
        var series = buildSeries();
        var firstMonth = series.history[0].month;
        var lastMonth = series.history[series.history.length - 1].month;
        var startMonth = series.forecast[0].month;
        var endMonth = series.forecast[series.forecast.length - 1].month;
        var angles = [];
        for (var i = 0; i < 3; i += 1) {
          angles.push(PROMPT_ANGLES[(promptRound * 3 + i) % PROMPT_ANGLES.length]);
        }
        promptRound += 1;
        return "你是住房公积金资金运行分析专家。请基于" + unitName.value + " " + firstMonth + " 至 " + lastMonth +
          " 的" + dataset.name + "历史数据（共 " + series.history.length + " 个月），重点结合" + angles.join("、") +
          "，预测 " + startMonth + " 至 " + endMonth + " 共 " + series.forecast.length + " 个月的" + dataset.name +
          "，并逐月给出预测说明及主要影响因素。";
      }

      function switchTab(key) {
        currentTab = key;
        dataset = DATASETS[key];
        llmEnabled = false;
        promptBox.classList.add("hidden");
        // 还原该页签的大模型预测结果，避免沿用上一次的预测
        dataset.llm = ORIGINALS[key].llm.slice();
        dataset.notes = Object.assign({}, ORIGINALS[key].notes);
        sectionTitle.textContent = dataset.name + "预测结果";
        chart.setAttribute("aria-label", dataset.name + "预测结果趋势图");
        renderChart();
        renderRows();
      }

      tabList.forEach(function (tab) {
        tab.addEventListener("click", function () {
          tabList.forEach(function (item) { item.classList.remove("active"); });
          tab.classList.add("active");
          switchTab(tab.getAttribute("data-tab"));
        });
      });

      stepUp.addEventListener("click", function () { changeCount(1); });
      stepDown.addEventListener("click", function () { changeCount(-1); });
      queryBtn.addEventListener("click", function () {
        renderChart();
        renderRows();
      });
      predictBtn.addEventListener("click", function () {
        renderChart();
        renderRows();
      });
      llmBtn.addEventListener("click", function () {
        llmEnabled = true;
        promptText.value = buildPromptText();
        promptBox.classList.remove("hidden");
        renderChart();
        renderRows();
      });
      // 数据预测：根据调整后的提示词与历史数据调用大模型，更新预测趋势图与数据详情
      promptPredictBtn.addEventListener("click", function () {
        var original = promptPredictBtn.textContent;
        promptPredictBtn.textContent = "预测中…";
        promptPredictBtn.disabled = true;
        setTimeout(function () {
          runLlmPredict();
          llmEnabled = true;
          renderChart();
          renderRows();
          promptPredictBtn.textContent = original;
          promptPredictBtn.disabled = false;
        }, 500);
      });
      // 提示词智能生成：调用大模型生成一版新的提示词
      promptSuggestBtn.addEventListener("click", function () {
        var original = promptSuggestBtn.textContent;
        promptSuggestBtn.textContent = "生成中…";
        promptSuggestBtn.disabled = true;
        setTimeout(function () {
          promptText.value = buildLlmPromptText();
          promptSuggestBtn.textContent = original;
          promptSuggestBtn.disabled = false;
        }, 500);
      });
      // 保存提示词：保存当前编辑后的提示词
      promptSaveBtn.addEventListener("click", function () {
        var original = promptSaveBtn.textContent;
        promptSaveBtn.textContent = "已保存";
        promptSaveBtn.disabled = true;
        setTimeout(function () {
          promptSaveBtn.textContent = original;
          promptSaveBtn.disabled = false;
        }, 1200);
      });
      saveBtn.addEventListener("click", function () {
        var original = saveBtn.textContent;
        saveBtn.textContent = "模型已保存";
        saveBtn.disabled = true;
        setTimeout(function () {
          saveBtn.textContent = original;
          saveBtn.disabled = false;
        }, 1200);
      });

      renderChart();
      renderRows();
    })();
