                <div class="table-card state-table-card">
                    <h3>鎵规鐘舵€?/h3>
                    <div class="state-table-scroll"><table><thead><tr><th>鎵规鍙?/th><th>鐘舵€?/th><th>鍛戒腑瑙勫垯</th></tr></thead><tbody id="batchTableBody"></tbody></table></div>
                </div>
            </div>
            <label for="stateDetail">鐘舵€?/ 瑙勫垯璇︽儏</label>
            <textarea id="stateDetail" rows="10" readonly spellcheck="false"></textarea>
        </section>

        <section id="callback" class="panel">
            <div class="section-title">
                <div>
                    <p class="eyebrow">Callback</p>
                    <h2>鍥炶皟閰嶇疆</h2>
                </div>
                <p class="muted">閰嶇疆鑷姩鍥炶皟鍜屾墜鍔ㄥ洖璋冿紝鐢ㄤ簬妯℃嫙閾惰寮傛閫氱煡涓氬姟绯荤粺銆?/p>
            </div>
            <div class="grid four">
                <div>
                    <label for="autoPushEnabled">鑷姩鍥炶皟</label>
                    <select id="autoPushEnabled">
                        <option value="true">寮€鍚?/option>
                        <option value="false">鍏抽棴</option>
                    </select>
                </div>
                <div>
                    <label for="delayMs">鍥炶皟寤惰繜(ms)</label>
                    <input id="delayMs" type="number" value="800">
                </div>
                <div>
                    <label for="defaultTargetUrl">榛樿鍥炶皟鍦板潃</label>
                    <input id="defaultTargetUrl" placeholder="鐢遍厤缃枃浠舵彁渚涳紝鍙湪姝や复鏃惰皟鏁?>
                </div>
                <div>
                    <label for="hsmMockKey">HSM 绉橀挜绉嶅瓙</label>
                    <input id="hsmMockKey" value="YHT-MOCK-HSM">
                </div>
            </div>
            <div class="grid four">
                <label class="checkbox"><input id="pushCaps107" type="checkbox" checked> 鎺ㄩ€?caps.107</label>
                <label class="checkbox"><input id="pushCaps205" type="checkbox" checked> 鎺ㄩ€?caps.205</label>
                <label class="checkbox"><input id="pushCaps306" type="checkbox" checked> 鎺ㄩ€?caps.306</label>
                <label class="checkbox"><input id="pushCaps308" type="checkbox" checked> 鎺ㄩ€?caps.308</label>
            </div>
            <div class="grid four compact-row">
                <div>
                    <label for="manualCallbackType">鎵嬪姩鍥炶皟鎶ユ枃</label>
                    <select id="manualCallbackType">
                        <option value="caps.306.001.01">caps.306.001.01</option>
                        <option value="caps.205.001.01">caps.205.001.01</option>
                        <option value="caps.107.001.01">caps.107.001.01</option>
                        <option value="caps.308.001.01">caps.308.001.01</option>
                        <option value="caps.600.001.01">caps.600.001.01</option>
                        <option value="caps.916.001.01">caps.916.001.01</option>
                    </select>
                </div>
            </div>
            <div class="actions left">
                <button id="saveConfigBtn" class="button primary">淇濆瓨閰嶇疆</button>
                <button id="triggerCallbackBtn" class="button secondary">鎵嬪姩鍙戦€佸洖璋?/button>
            </div>
            <h3>交易成功自动动账通知</h3>
            <p class="muted">默认关闭。启用后调用结算系统模拟动账接口并触发后续处理。与 CAPS 回调开关独立，保存配置后生效。</p>
            <div class="grid four">
                <div><label for="movementEnabled">自动生成并提交</label><select id="movementEnabled"><option value="false">关闭</option><option value="true">开启</option></select></div>
                <div><label for="movementTargetUrl">模拟动账接口完整地址</label><input id="movementTargetUrl" placeholder="http://测试服务/api/v1/ywgl/saveZhbdzt"></div>
                <div><label for="movementReceiveCode">收款动账代码</label><input id="movementReceiveCode" maxlength="10" placeholder="按结算系统动账字典填写"></div>
                <div><label for="movementPayCode">付款动账代码</label><input id="movementPayCode" maxlength="10" placeholder="按结算系统动账字典填写"></div>
                <div><label for="movementCounterpartyAccount">统一虚拟对手账号</label><input id="movementCounterpartyAccount" maxlength="40"></div>
                <div><label for="movementCounterpartyName">统一虚拟对手户名</label><input id="movementCounterpartyName" maxlength="80"></div>
                <div><label for="movementCounterpartyBank">统一虚拟对手行号</label><input id="movementCounterpartyBank" maxlength="40"></div>
                <div><label for="movementBalance">模拟余额（非真实余额）</label><input id="movementBalance" type="number" step="0.01" value="0.00"></div>
                <div><label for="movementAuthorizationEnv">鉴权环境变量名称（可选）</label><input id="movementAuthorizationEnv" placeholder="只填变量名，不填 Token"></div>
            </div>
            <p class="muted">收款为正金额、付款为负金额。结果在接口记录中查看 MOVEMENT / saveZhbdzt；结果不明不自动重试，避免重复动账。清除全部历史数据也会清除去重记录。</p>
            <div class="actions left"><button id="saveMovementConfigBtn" class="button primary">保存配置</button></div>
            <pre id="callbackResult" class="result"></pre>
        </section>
    </main>
</div>
